## BlueBee IoT — EMQX extra config (dev/test)
## Bootstrap API key para o backend provisionar usuários MQTT via REST API
## Key/secret definidos em infra/emqx/bootstrap_api_keys.txt

api_key {
  bootstrap_file = "/opt/emqx/data/bootstrap_api_keys.txt"
}

## ── Proteção do broker ───────────────────────────────────────────────────────
## Limites FOLGADOS para operação normal (ver infra/emqx/README.md para o
## racional). Objetivo: um gateway com defeito (loop de publish, payload
## gigante, reconexão em loop) não degrada o broker para os demais tenants.

## Tamanho máximo de pacote MQTT por cliente. O maior payload legítimo é o
## config de um gateway grande (centenas de pontos) — fica bem abaixo de 1 MB.
mqtt {
  max_packet_size = "1MB"
}

## Rate limit por conexão no listener TCP: mensagens/s e bytes/s.
## Gateway normal publica ~1 msg/s (telemetria agregada) + health/status.
## 200 msg/s e 512 KB/s por cliente = ordem de 100x a operação normal.
listeners.tcp.default {
  messages_rate = "200/s"
  bytes_rate = "512KB/s"
}

## Flapping: cliente que conecta/desconecta em loop (credencial ruim, watchdog
## reiniciando) é banido temporariamente — protege o broker do custo de
## handshake/auth repetido. 15 (des)conexões em 1 min → ban de 5 min.
flapping_detect {
  enable = true
  max_count = 15
  window_time = "1m"
  ban_time = "5m"
}
