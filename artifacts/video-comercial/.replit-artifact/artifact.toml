kind = "video"
previewPath = "/video-comercial/"
title = "Vídeo Comercial BlueBee"
version = "1.0.0"
id = "artifacts/video-comercial"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/video-comercial/" ]
localPort = 25686

[services.development]
run = "npm --prefix /home/runner/workspace/artifacts/video-comercial run dev"

[services.production]
build = [ "bash", "-c", "npm --prefix /home/runner/workspace/artifacts/video-comercial install --no-audit --no-fund && npm --prefix /home/runner/workspace/artifacts/video-comercial run build" ]
publicDir = "artifacts/video-comercial/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25686"
BASE_PATH = "/video-comercial/"
